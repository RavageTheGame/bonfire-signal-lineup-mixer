<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonfire Signal — Issue Lineup Mixer</title>
  <style>
    :root {
      --navy: #132540;
      --ember: #E9633F;
      --body: #3E4A5A;
      --body-2: #4A5666;
      --panel: #F2F5F4;
      --page: #E6E9E8;
      --muted: #8B96A2;
      --rule: #E4E8E7;
      --rule-2: #C8D2D2;
      --link: #C4502B;
      --paper: #ffffff;
      --good: #3f7f5a;
      --warn: #b1782f;
      --shadow: 0 1px 2px rgba(19, 37, 64, .06), 0 16px 40px rgba(19, 37, 64, .08);
      --radius: 12px;
      --sans: Helvetica, Arial, sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--navy);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(233, 99, 63, .08), transparent 55%),
        linear-gradient(180deg, #f7f8f7 0%, var(--page) 100%);
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 20px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--ember);
      letter-spacing: .14em;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: -.02em;
      color: var(--navy);
    }

    .deck {
      max-width: 620px;
      margin: 8px 0 0;
      color: var(--body-2);
      line-height: 1.45;
      font-size: 15px;
    }

    .state-note {
      border: 1px solid var(--rule-2);
      background: rgba(255, 255, 255, .85);
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      max-width: 280px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(420px, 640px);
      gap: 18px;
      align-items: start;
    }

    .panel, .preview-shell {
      border: 1px solid var(--rule-2);
      background: rgba(255, 255, 255, .9);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--rule);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -.01em;
    }

    .counter {
      font-size: 12px;
      font-weight: 700;
      color: var(--ember);
      background: rgba(233, 99, 63, .12);
      padding: 5px 9px;
      border-radius: 999px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px 0;
    }

    .chip {
      appearance: none;
      border: 1px solid var(--rule-2);
      background: #fff;
      color: var(--body);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip[aria-pressed="true"] {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }

    .chip:focus-visible {
      outline: 3px solid rgba(233, 99, 63, .35);
      outline-offset: 2px;
    }

    .controls {
      display: grid;
      gap: 14px;
      padding: 14px 16px 16px;
      max-height: 760px;
      overflow: auto;
    }

    .section-card {
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
    }

    .section-title {
      padding: 11px 13px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      border-bottom: 1px solid var(--rule);
      background: var(--panel);
    }

    .section-title h3 {
      margin: 0;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .section-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .option {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      padding: 12px 13px;
      border-bottom: 1px solid rgba(228, 232, 231, .9);
      cursor: pointer;
      transition: background .15s ease;
    }

    .option:last-child { border-bottom: 0; }
    .option:hover { background: #fbfcfc; }
    .option:has(input:focus-visible) { outline: 3px solid rgba(233, 99, 63, .28); outline-offset: -3px; }
    .option.is-disabled { opacity: .45; cursor: not-allowed; }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    .check {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border: 1.5px solid var(--rule-2);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #fff;
      flex-shrink: 0;
    }

    .option[data-kind="checkbox"] .check { border-radius: 5px; }

    .option.is-on .check {
      background: var(--ember);
      border-color: var(--ember);
      box-shadow: inset 0 0 0 3px #fff;
    }

    .option-title {
      display: block;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.3;
      color: var(--navy);
    }

    .meta {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 2px 7px;
      background: #fff;
    }

    .pill.approved {
      color: var(--good);
      border-color: rgba(63, 127, 90, .35);
      background: rgba(63, 127, 90, .08);
    }

    .pill.missing {
      color: var(--warn);
      border-color: rgba(177, 120, 47, .35);
      background: rgba(177, 120, 47, .08);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 14px 16px 8px;
      border-top: 1px solid var(--rule);
      background: var(--panel);
    }

    button.action {
      min-height: 42px;
      border: 1px solid var(--rule-2);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      padding: 10px 12px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    button.action:hover { transform: translateY(-1px); border-color: #b7c2c2; background: #fff; }
    button.action:focus-visible { outline: 3px solid rgba(233, 99, 63, .32); outline-offset: 2px; }
    button.action.primary { background: var(--navy); color: white; border-color: var(--navy); }
    button.action.primary:hover { background: #0e1c30; }

    .toast {
      min-height: 20px;
      padding: 0 16px 14px;
      color: var(--good);
      font-size: 13px;
      font-weight: 650;
      background: var(--panel);
    }

    .preview-shell {
      padding: 16px;
      background: var(--page);
    }

    .preview-label {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin: 0 0 12px;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }

    .email {
      max-width: 680px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--rule-2);
      box-shadow: 0 18px 42px rgba(19, 37, 64, .12);
    }

    .email-inner { padding: 0 0 8px; }

    .masthead {
      background: var(--navy);
      color: #fff;
      padding: 28px 34px 24px;
    }

    .brand {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.05;
    }

    .brand span { color: var(--ember); }

    .issue-line {
      margin-top: 10px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .subhead {
      margin-top: 14px;
      color: rgba(255,255,255,.86);
      font-size: 14px;
      line-height: 1.5;
      max-width: 46ch;
    }

    .attr {
      margin-top: 12px;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      line-height: 1.4;
    }

    .email-pad { padding: 28px 34px 34px; }

    .email-section { margin-top: 30px; }
    .email-section:first-child { margin-top: 0; }

    .sec-rule {
      display: grid;
      grid-template-columns: auto auto 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .sec-num {
      color: var(--ember);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .sec-label {
      margin: 0;
      color: var(--navy);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .sec-rail {
      height: 1px;
      background: var(--rule-2);
    }

    .sec-sub {
      margin: -6px 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .email h2 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 34px;
      line-height: 1.18;
      letter-spacing: -.02em;
      color: var(--navy);
    }

    .email h2.field {
      font-size: 26px;
      line-height: 1.24;
    }

    .byline {
      margin: 0 0 14px;
      color: var(--ember);
      font-size: 13px;
      font-weight: 700;
    }

    .body-copy {
      color: var(--body);
      font-size: 16px;
      line-height: 1.68;
    }

    .body-copy p { margin: 0 0 16px; }
    .body-copy p:first-child { font-size: 19px; color: var(--navy); line-height: 1.55; }
    .body-copy.field p:first-child { font-size: 16px; color: var(--body); }
    .body-copy p:last-child { margin-bottom: 0; }

    .team-list {
      display: grid;
      gap: 12px;
      margin-top: 4px;
    }

    .team-item {
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 16px 16px 14px;
    }

    .team-name {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .team-item h3 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.3;
      color: var(--navy);
    }

    .team-item .body-copy {
      font-size: 15px;
      line-height: 1.65;
    }

    .team-item .body-copy p:first-child {
      font-size: 15px;
      color: var(--body);
    }

    .placeholder {
      border: 1.5px dashed #c8d2d2;
      background: #fbfcfc;
      border-radius: 10px;
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .cta-box {
      margin-top: 34px;
      padding: 22px 20px;
      background: var(--navy);
      color: #fff;
      border-radius: 10px;
    }

    .cta-box h4 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.25;
    }

    .cta-box p {
      margin: 0 0 14px;
      color: rgba(255,255,255,.82);
      font-size: 14px;
      line-height: 1.5;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cta-btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      background: var(--ember);
      color: #fff;
    }

    .cta-btn.ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
    }

    .team-row {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
    }

    .team-row .label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .team-row .names {
      margin: 0;
      color: var(--navy);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 650;
    }

    .tiny {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .empty-data {
      padding: 28px 18px;
      color: var(--body-2);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .controls { max-height: none; }
      .state-note { max-width: none; }
    }

    @media (max-width: 640px) {
      .app { padding: 14px 12px 28px; }
      .topbar { display: block; }
      .state-note { margin-top: 12px; }
      .actions { grid-template-columns: 1fr; }
      .masthead, .email-pad { padding-left: 20px; padding-right: 20px; }
      .email h2 { font-size: 28px; }
      .email h2.field { font-size: 23px; }
      .brand { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Bonfire Signal</p>
        <h1>Issue lineup mixer</h1>
        <p class="deck">Pick one Bonfire View, four Team takes, and one Field Note from live Pieces. The preview renders as the issue would ship, including bylines and the contributor row.</p>
      </div>
      <div class="state-note" id="syncNote">Loading Pieces from Notion sync…</div>
    </header>

    <section class="workspace" aria-label="Signal lineup mixer">
      <div class="panel">
        <div class="panel-head">
          <h2>Picker</h2>
          <div class="counter" id="teamCounter">0/4 Team takes</div>
        </div>
        <div class="filters" role="group" aria-label="Status filter">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">All statuses</button>
          <button type="button" class="chip" data-filter="Approved" aria-pressed="false">Approved</button>
          <button type="button" class="chip" data-filter="Draft" aria-pressed="false">Draft</button>
        </div>
        <div class="controls" id="picker"></div>
        <div class="actions">
          <button type="button" class="action" id="clearBtn">Clear lineup</button>
          <button type="button" class="action primary" id="randomBtn">Random complete lineup</button>
          <button type="button" class="action" id="copyBtn">Copy lineup summary</button>
        </div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </div>

      <aside class="preview-shell">
        <div class="preview-label">
          <span>Signal email preview</span>
          <span id="completeState">Incomplete</span>
        </div>
        <article class="email" aria-label="Email preview">
          <div class="email-inner" id="preview"></div>
        </article>
      </aside>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'bonfireSignalLiveLineup.v1';
    const INLINE_PIECES = {"syncedAt":"2026-09-30T17:15:19.730Z","source":"Notion Signal Pieces","pieces":[{"id":"ccb9a2ac-0681-43b7-94a5-646eedfd50f5","title":"AI pricing needs two meters","partner":"Jen","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/ccb9a2ac068143b794a5646eedfd50f5","hasBody":true,"bodyHtml":"<p>AI products create value in two different moments.</p><p>First they organize context. They connect data, permissions, memory, and domain rules into a trusted operating layer. Then they consume resources to perform work on top of it.</p><p>Seat pricing compresses those layers into one imperfect proxy. A better model may use two meters. Price the durable context as a platform commitment. Price the work through usage that grows with adoption.</p><p>The pricing model becomes easier to defend because it mirrors the product. Customers pay to establish the environment, then pay more when the environment does more.</p>","options":[]},{"id":"a4198480-113a-4265-9ec7-eb1594da1d11","title":"Credibility is a form of distribution","partner":"Jen","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/a4198480113a42659ec7eb1594da1d11","hasBody":true,"bodyHtml":"<p>Early companies often treat customer proof as a sales artifact. It is more powerful when treated as distribution.</p><p>A credible customer does not merely validate the product. A public partnership can lower perceived risk for the next buyer, attract partners, and make future outreach warmer. One customer&#x27;s willingness to tell the story changes how the market receives every story after it.</p><p>That right should be designed into the relationship. Announcement language, quotes, references, and case studies are not favors to request months later. They are part of the value exchanged when the partnership begins.</p><p>Revenue compounds through renewals. Credibility compounds through permission to be seen.</p>","options":[]},{"id":"eebefb64-3470-4777-950b-80228a885ffc","title":"Ecosystems can manufacture warm distribution","partner":"Jason","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/eebefb6434704777950b80228a885ffc","hasBody":true,"bodyHtml":"<p>Warm distribution is usually treated as a network someone already has. It can also be designed.</p><p>Companies serving adjacent parts of the same ecosystem often know the customers the others want to meet. A useful operator forum can turn that overlap into repeated trusted access, especially when the gathering solves a real customer problem instead of staging a sequence of pitches.</p><p>The value is not the event. It is the distribution loop. Each participant contributes relationships and earns relevance with the others.</p><p>Networks become defensible when participation makes every member easier to discover and trust.</p>","options":[]},{"id":"eee78b14-39f0-4b38-81cc-7965832a3431","title":"Every enterprise sale changes audience halfway through","partner":"Jen","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/eee78b1439f04b3881cc7965832a3431","hasBody":true,"bodyHtml":"<p>Enterprise software is rarely bought once. It is bought repeatedly by different groups inside the same company.</p><p>The business sponsor buys the outcome. Technical teams buy safety, control, and compatibility. Procurement buys comparability. Finance buys a defensible commitment. A founder who keeps presenting one universal pitch forces each audience to translate the product alone.</p><p>The better enterprise motion is a sequence of connected sales. Each handoff has its own proof, objection map, and internal artifact. The story stays coherent while the evidence changes.</p><p>The deal does not stall because the value disappeared. It stalls because the audience changed and the sales motion did not.</p>","options":[]},{"id":"f78839ea-dc74-4aa5-830b-3682457f5b4c","title":"Moving upmarket changes the company before the customer","partner":"Brett","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/f78839eadc744aa5830b3682457f5b4c","hasBody":true,"bodyHtml":"<p>Upmarket strategy is often described as a change in target customer. It is first a change in operating system.</p><p>Larger buyers introduce more stakeholders, longer internal cycles, and more ways for momentum to disappear. The seller must shape the process instead of simply responding to it. Product must support deeper controls. Leadership must tolerate fewer deals with more concentration.</p><p>That is why adding enterprise leads to a transactional sales machine rarely works. The company has changed its aspiration without changing the behavior required to deliver it.</p><p>Moving upmarket starts internally. The larger customer is the consequence.</p>","options":[]},{"id":"af31ccff-0590-4b49-999e-10529a4945f0","title":"Permission is the scarce resource in enterprise AI","partner":"Brett","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/af31ccff05904b49999e10529a4945f0","hasBody":true,"bodyHtml":"<p>Enterprise AI is advancing faster than organizational permission.</p><p>Models can already perform more work than most customers will allow them to own. The gap is trust. Users need to see that the system understands context, respects boundaries, and recovers safely before they delegate consequential actions.</p><p>Products should therefore sequence autonomy. Observe first. Recommend next. Assist within a boundary. Execute only after accuracy has become familiar.</p><p>The winning agent may not be the one that can do the most on day one. It may be the one that earns permission fastest.</p>","options":[]},{"id":"ce0d56ab-e086-4fa5-95eb-2a756dc1b02c","title":"Quarterly plans. Monthly adjustments","partner":"Brett","type":"Big Idea","status":"Approved","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/ce0d56abe0864fa595eb2a756dc1b02c","hasBody":false,"bodyHtml":"","options":[]},{"id":"e2f11f8b-c7dc-4dc0-a3b4-00e91d1f6a50","title":"Strategy is a portfolio of bounded experiments","partner":"Jim","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/e2f11f8bc7dc4dc0a3b400e91d1f6a50","hasBody":true,"bodyHtml":"<p>Early-stage strategy is often less about choosing one permanent answer and more about designing better tests.</p><p>A new category, channel, or buyer can look promising after a handful of introductions. The company should respond with a bounded experiment rather than an organizational commitment. Define the owner, audience, message, duration, and evidence that earns another round of investment.</p><p>This preserves focus without making the company rigid. It also prevents anecdotes from becoming strategy merely because they arrived at the right moment.</p><p>Conviction should determine which experiments deserve to run. Evidence should determine which ones become the plan.</p>","options":[]},{"id":"d14097ea-7e52-4e7b-bb67-494fbee92334","title":"The future of AI products is remembered work","partner":"Brett","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/d14097ea7e524e7bbb67494fbee92334","hasBody":true,"bodyHtml":"<p>The first generation of AI products answered questions. The next generation will remember work.</p><p>A useful response creates value once. A product that recognizes repetition can turn that response into a routine, preserve the user&#x27;s preferences, and improve the workflow every time it runs. The interface shifts from asking again to supervising what has already been learned.</p><p>This changes the adoption metric. Prompt volume matters less than the amount of work the product can reliably remember and repeat.</p><p>Chat made intelligence accessible. Remembered work makes it operational.</p>","options":[]},{"id":"c78909a6-4bb7-461e-ba7a-66754f5148f5","title":"The goal of runway is freedom of action","partner":"Dominique","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/c78909a64bb7461eba7a66754f5148f5","hasBody":true,"bodyHtml":"<p>Runway is usually discussed as time. Founders should also understand it as freedom.</p><p>A company with twelve months of cash and no credible path to self-funding may have fewer real choices than one with a lower balance and a clear crossing point into cash generation. The absolute number matters, but the path determines who controls the next decision.</p><p>Good planning identifies the lowest conservative balance, the operating milestones that lead to cash generation, and the timing risks that could widen the gap.</p><p>The goal is not an impressive number of months. It is reaching the point where the company can choose its future again.</p>","options":[]},{"id":"c47689c8-0ea1-4d5c-9c3c-d981eb97eb8d","title":"Trust is a capability. Lineage beats slogans","partner":"Brett","type":"Big Idea","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/c47689c80ea14d5c9c3cd981eb97eb8d","hasBody":false,"bodyHtml":"","options":[]},{"id":"dcf196a3-2658-447c-9356-9d76a984d183","title":"One platform. Different customer experiences","partner":"Jason","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/dcf196a32658447c93569d76a984d183","hasBody":true,"bodyHtml":"<p>One portfolio company reached a familiar product crossroads. Large customers wanted experiences that felt completely their own, but the team could not afford to maintain a separate product for every account.</p><p>The answer was not more customization. It was a shared platform that could render differently according to each customer&#x27;s rules and audience. The customer controlled the experience while the company kept one operating core.</p><p>The shift changed the roadmap question from what feature does this customer need to what should the platform let every customer compose.</p>","options":[]},{"id":"b58e22e7-28ee-417d-a370-8767c5d4b502","title":"Services revenue can starve the product","partner":"Dominique","type":"Field Notes","status":"Draft","issue":null,"issueId":null,"url":"https://app.notion.com/b58e22e728ee417da3708767c5d4b502","hasBody":true,"bodyHtml":"<p>When cash gets tight, services look like oxygen. A few paid implementations.</p><p>We were in the thick of that decision. Our pipeline was improving and we thought we could make the plan. The part of the business customers wanted most was professional services. There was a real chance it could grow much faster than we expected.</p><p>That should have been uncomplicated good news. It was not.</p><p>To deliver the work, we would need to hire before the customers paid us. If demand kept growing, the cash balance could fall even while revenue climbed. We considered raising more capital or opening a credit line simply to give ourselves room.</p><p>The bigger problem was what the demand might turn us into. We could already see competitors in our category that were difficult to distinguish from services firms. Their products existed, but people were doing much of the work around them. We understood how easily the same thing could happen to us.</p><p>What we learned was that services were not the problem. The missing boundary was.</p><p>The useful services engagements were the ones that helped us build something repeatable. A defined implementation package helped customers reach the product faster and generated cash. Work that required more people and more customization with every sale pulled us away from the product we meant to build.</p><p>We also learned that borrowing simply to make the cash balance look safer would not solve the underlying issue. Holding our nerve and managing toward cash flow breakeven gave us more control.</p>","options":[]},{"id":"669b4b41-d324-4bdc-89db-6d823ec4ce5d","title":"The acquisition closed. The migration work began","partner":"Jim","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/669b4b41d3244bdc89db6d823ec4ce5d","hasBody":true,"bodyHtml":"<p>A portfolio company acquired a smaller product with a concentrated group of meaningful customers. The transaction was the easy part.</p><p>The team planned to speak with every customer, understand the current pain, and schedule migrations around each account&#x27;s constraints. Busy season was approaching, so both platforms would remain supported while the team moved customers carefully.</p><p>The founders understood that ownership created leverage but not loyalty. Every migration still required discovery, a recommendation, and a sale.</p>","options":[]},{"id":"f18d6eb5-5625-4d08-e212-7addb8b8d56","title":"The finance team shortened the planning loop","partner":"Brett","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/f18d6eb5562543d08e2127addb8b8d56","hasBody":true,"bodyHtml":"<p>A finance software company began with a simple observation. AI was compressing the operating cycle of the businesses it served, but planning still moved on an annual and quarterly rhythm.</p><p>The team started redesigning the product around signals and action. A delayed implementation could affect cash. A pipeline change could alter hiring. Finance needed to surface the decision, model the response, and update the plan while the business was still moving.</p><p>The product vision shifted from reporting what happened to helping the company decide what happens next.</p>","options":[]},{"id":"732aeacc-3f5b-4714-8b20-f4bd207d9c21","title":"The internal system attracted an external market","partner":"Dominique","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/732aeacc3f5b47148b20f4bd207d9c21","hasBody":true,"bodyHtml":"<p>A portfolio company had built internal capture and quality systems to deliver data more reliably. Then suppliers and customers began asking to use those systems themselves.</p><p>The request created an uncomfortable debate. Opening the tools could expose a competitive advantage. Keeping them closed could ignore a larger platform opportunity.</p><p>The team began reframing the question. If outside participants brought their own contributors and data onto the company&#x27;s infrastructure, the product might create more dependence and a larger network than the original service ever could.</p>","options":[]},{"id":"ca1cd58c-7741-4d07-b991-04bc11f0fcb0","title":"The market opened when the incumbent went quiet","partner":"Jen","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/ca1cd58c77414d07b99104bc11f0fcb0","hasBody":true,"bodyHtml":"<p>A portfolio company had been selling into a market with an established incumbent. Then customers stopped hearing back from that vendor.</p><p>The change was immediate. Prospects that once required a long education process were suddenly willing to evaluate from the demo alone. Outbound no longer felt like an interruption because buyers already had a reason to move.</p><p>The team&#x27;s advantage was temporary. It had to reach the exposed customers, present a credible migration path, and convert urgency into trust before the window closed.</p>","options":[]},{"id":"bc421f8a-3ebe-4574-8314-631e6e24f040","title":"The model became useful when the numbers moved","partner":"Jim","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/bc421f8a3ebe45748314631e6e24f040","hasBody":true,"bodyHtml":"<p>A founder came into a planning conversation knowing the forecast would change. Instead of defending the base case, the team worked through the operating levers underneath it.</p><p>What happens if hiring moves. What happens if growth arrives later. Which assumption has the strongest relationship to the outcome. The model became less of a prediction and more of a map for decisions.</p><p>The useful moment was not when everyone agreed on the number. It was when the founder could explain what the company would change when the number changed.</p>","options":[]},{"id":"232176a1-9ebe-40d1-a554-49fdc46f98f0","title":"The pilot changed the bottleneck","partner":"Jen","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/232176a19ebe40d1a55449fdc46f98f0","hasBody":true,"bodyHtml":"<p>A robotics company entered a pilot trying to prove the product could work in one warehouse. Customer demand moved faster than expected.</p><p>Soon the discussion included several facilities and much larger deployments. The original product risk was shrinking. A new risk had appeared instead. Could the company manufacture, deploy, and support the system as quickly as customers wanted it.</p><p>The founder described the transition clearly. Productionize one warehouse, then the problem becomes talent and capacity rather than product or sales.</p>","options":[]},{"id":"bb220b4a-c114-4424-b746-61ec596a4a51","title":"The pricing session split the platform in two","partner":"Jen","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/bb220b4ac1144424b74661ec596a4a51","hasBody":true,"bodyHtml":"<p>A portfolio company entered a pricing session with tiers built around users, workflows, and applications. The conversation kept returning to a more basic question. What was the customer actually paying for.</p><p>The answer separated the product into two layers. The platform made sense of the customer&#x27;s data and context. The applications and agents performed work on top of it.</p><p>Once those layers were visible, the pricing problem changed. The team could price the durable context and meter the work instead of forcing every source of value into a seat.</p>","options":[]},{"id":"cc66f61f-f26a-46f8-a836-7eed7414469e","title":"The services line grew faster than the comfort level","partner":"Dominique","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/cc66f61ff26a46f8a8367eed7414469e","hasBody":true,"bodyHtml":"<p>A software company saw growing demand for professional services. Customers wanted the help and the work could generate cash, but the growth came with a warning.</p><p>More services meant hiring ahead of delivery and managing a tighter cash cycle. It also risked pulling the organization toward custom work that looked like growth while making the product harder to scale.</p><p>The company did not reject the revenue. It began separating services that generated cash and product learning from services that merely absorbed capacity.</p>","options":[]},{"id":"9405e78a-4dda-4029-8210-aecd16fadbca","title":"The wedge came with a deadline","partner":"Jason","type":"Field Notes","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/9405e78a4dda40298210aecd16fadbca","hasBody":true,"bodyHtml":"<p>One team had chosen a narrow market to sharpen the product and learn faster. The focus was working, but the founders did not want a temporary wedge to become a permanent ceiling.</p><p>So they gave the strategy a deadline. By November, the team expected enough signal to decide whether the current segment deserved more investment or whether the product had earned the right to expand.</p><p>The date turned focus from a belief into a test. Staying narrow and moving outward both required evidence.</p>","options":[]},{"id":"7dd5e3e5-0638-4081-a595-94489d9c1224","title":"A customer announcement is a distribution asset","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/7dd5e3e506384081a59594489d9c1224","hasBody":true,"bodyHtml":"<p>A recognizable customer can distribute your credibility.</p><p>The first enterprise logo does more than add revenue. A coordinated announcement can reduce perceived risk for every buyer who follows.</p><p>That value should not be left until after the contract is signed. Founders should discuss the case study, announcement, quote, and referral rights while the partnership is being formed. A quiet logo proves less than a customer willing to explain why they chose you.</p><p>Commercial value sits in the contract. Market value sits in the story you are allowed to tell.</p>","options":[]},{"id":"958513d8-d1ec-4c72-8e02-ed4a3a1c8c63","title":"A forecast should expose the levers","partner":"Jim","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/958513d8d1ec4c728e02ed4a3a1c8c63","hasBody":true,"bodyHtml":"<p>The forecast will be wrong. The levers still need to be right.</p><p>An early stage model is not valuable because it predicts the future precisely. It is valuable because it shows whether the founder understands how the business works.</p><p>The useful conversation is not a defense of the base case. It is what changes when growth, hiring, pricing, or product investment moves. A founder who can explain those levers is showing control over the business, even when the numbers change.</p><p>The model fails when the levers have little relationship to what actually happens. At that point the problem is not uncertainty. It is the wrong causal story.</p>","options":[]},{"id":"51ab43bd-ccb7-4bc1-ab30-2929adc3edd6","title":"A new category needs a deliberate outbound experiment","partner":"Jim","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/51ab43bdccb74bc1ab302929adc3edd6","hasBody":true,"bodyHtml":"<p><strong>A few promising introductions do not make a new category.</strong> Adjacent-market interest is a signal. Turn it into a bounded outbound experiment before it becomes strategy. Choose the target list, owner, message, and period. Decide what response rate, conversion, or contract size earns more investment. Then run the test without confusing activity with validation. Otherwise the company is catching whatever arrives and calling the pattern intentional.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>Earn the right to enter the next market.</strong> Define a deliberate test and the evidence that would justify expansion. A new vertical should graduate from experiment to strategy, not from anecdote to slide.</p>"}]},{"id":"49743ac9-6be9-42e4-95a3-746b18dbf5db","title":"A small acquisition is a customer migration","partner":"Jim","type":"Team take","status":"Draft","issue":null,"issueId":null,"url":"https://app.notion.com/49743ac96be942e495a3746b18dbf5db","hasBody":true,"bodyHtml":"<p><strong>Call every customer before you build the migration machine.</strong> When you buy a small product or a small customer book, it is tempting to start with an integration plan, but that is usually the wrong first move. If there are only a few meaningful accounts, the first job is not systems. It is the customer conversation. Talk to each customer, understand what is working, name the real switching risk, and recommend a path. Then sequence the technical work around what you learned, instead of asking the migration program to do the persuading for you. You already own the contract, but you still have to earn the move.</p>","options":[]},{"id":"d5c22cb2-9cf1-4a02-9ac1-2f0fa121c462","title":"A wedge needs an expansion clock","partner":"Jason","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/d5c22cb29cf14a029ac12f0fa121c462","hasBody":true,"bodyHtml":"<p><strong>Focus needs an expiration test.</strong> A narrow wedge helps a young company win because it sharpens the buyer, the product, and the proof. It becomes a ceiling when the team cannot say what evidence earns the next market. Set an expansion clock. By a specific milestone, the wedge should show activation, retention, and one proof that transfers to an adjacent segment. If the evidence is not there, stay focused. If it is, expand because the market earned it, not because the total addressable market slide needs help. Focus is a means. It should not become the company's identity by accident.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>A wedge is useful only if you know when to leave it.</strong> The best founders define the evidence and the date that determine whether a narrow market becomes a launchpad or a ceiling. Expansion without proof is distraction. Focus without a clock is drift.</p>"}]},{"id":"24406479-fe2c-4b3e-967e-1177816b3ec9","title":"Autonomy has to climb a trust ladder","partner":"Brett","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/24406479fe2c4b3e967e1177816b3ec9","hasBody":true,"bodyHtml":"<p>Autonomy has to climb a trust ladder.</p><p>Customers rarely want a new agent to take control on day one. They first need proof that it understands the work and respects the boundaries.</p><p>Start by observing. Then recommend. Help with a bounded task. Only after those steps should the product ask to run the work on a recurring basis.</p><p>Every rung earns the next one. Products that jump straight to execution may demonstrate technical power while slowing actual adoption.</p>","options":[]},{"id":"41b04b88-e73e-453e-afe8-3b4afe7c56f2","title":"Competitor disruption turns outbound into inbound","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/41b04b88e73e453eafe83b4afe7c56f2","hasBody":true,"bodyHtml":"<p><strong>A competitor's disruption can turn your outbound into a service.</strong> Most outbound interrupts a buyer who is not ready to move. That changes when an acquisition, shutdown, or product shift forces customers to reconsider a tool they depend on. In that window, speed matters more than clever messaging. Reach every exposed customer, explain the migration path, and make the first evaluation easy. The company that looks like the safest continuation can inherit demand it did not create. This is not a permanent advantage. It is a short window in which relevance arrives before your email does.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>When the incumbent stops answering, your cold email is no longer cold.</strong> A competitor change can collapse the buying timeline overnight. The winners arrive immediately with a credible migration story and enough product readiness to turn urgency into trust.</p>"}]},{"id":"1c09d338-a2bf-40d5-b1fe-30f234d20a9d","title":"Composable wins when the customer owns the experience","partner":"Jason","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/1c09d338a2bf40d5b1fe30f234d20a9d","hasBody":true,"bodyHtml":"<p><strong>If the customer owns the audience, they will eventually want to own the experience.</strong> White label software works until the experience itself becomes part of the customer's advantage. A new logo and a few settings are not enough when every audience needs a different journey. That is where composable products win. One platform can support many experiences while the customer controls the interface, rules, and context. The vendor keeps one product. The customer does not have to look like everyone else using it. The test is simple. If every meaningful change still needs vendor engineering, the product is configurable, not composable.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>White label changes the logo. Composable changes the experience.</strong> Customers increasingly want the speed of a shared platform without giving up control of what their users see and do. The durable product is the one that lets them shape the journey without forcing the vendor to build a separate product every time.</p>"}]},{"id":"7a58fa5d-f159-4052-8824-06621e1a43be","title":"Customer overlap can become a distribution channel","partner":"Jason","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/7a58fa5df1594052882406626e1a43be","hasBody":true,"bodyHtml":"<p><strong>Customer overlap can become a distribution channel.</strong> Companies serving adjacent parts of an ecosystem often know the buyers the others want to meet. A focused roundtable can turn that overlap into trusted access. The event should be designed around a shared customer problem, not a parade of founder pitches. Invite credible operators, make the exchange useful, and let introductions emerge from the work. Founder networking is a side effect. Customer distribution is the product.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>The best portfolio event may be built for customers.</strong> When adjacent companies share an ecosystem, a useful operator conversation can create warmer distribution than a stack of cold introductions.</p>"}]},{"id":"259acbb6-8375-47ea-8b83-250446dd97e3","title":"Enterprise urgency starts with a proof point","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/259acbb6837547ea8b83250446dd97e3","hasBody":true,"bodyHtml":"<p><strong>A good demo earns interest. A proof point creates urgency.</strong> Enterprise buyers can admire a product for months without buying it. The founder's job is to produce one result that gives the champion a reason to move now and something credible to carry into every internal room. That proof can be a visible economic gain, a reduced operational risk, or evidence that a peer is moving first. It should be designed before the pilot begins, not discovered afterward. If the proof does not shorten the process or widen the buying group, it is not yet strong enough.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>Do not ask the enterprise to believe the roadmap.</strong> Give the buyer one measurable result that makes waiting feel irresponsible. A portable proof travels farther inside a large company than another impressive demo.</p>"}]},{"id":"4e4133e1-a5a9-427e-b84f-0392cedd756c","title":"Price the context separately from the consumption","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/4e4133e1a5a9427eb84f0392cedd756c","hasBody":true,"bodyHtml":"<p><strong>AI platforms create value before the first token is used.</strong> They organize the customer's data, permissions, and operating context. Then they consume compute to perform work on top. Those are different layers of value. A platform fee can price the durable context. Usage can price the work. Separating them makes the fixed commitment easier to defend and gives the customer a variable path that grows with adoption. One price for both layers can hide what the customer is actually buying.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>Price the context. Meter the work.</strong> The trusted operating layer has durable value. The agents running on it create variable value. Pricing should make both visible.</p>"}]},{"id":"e540cc70-b31f-4c83-a370-f33433f79232","title":"Price the work, not the headcount","partner":"Brett","type":"Team take","status":"Approved","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/e540cc70b31f4c83a370f33433f79232","hasBody":true,"bodyHtml":"<p>Seat pricing worked when each additional user created another unit of value. AI breaks that relationship. A system can complete work across an entire workflow, sometimes without anyone logging in. Charging by seat can punish the behavior that makes the product better, broad access and more shared context.</p><p>The better model is to open access and charge against a predictable unit of value. That might be work completed, transactions processed, or a prepaid usage band the customer can budget for.</p><p>Do not hand buyers a token bill. Give them a price that grows when useful work grows.</p>","options":[]},{"id":"8b56d342-c23a-4da3-989c-50c32764faaf","title":"Repeated AI behavior should become a routine","partner":"Brett","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/8b56d342c23a4da3989c50c32764faaf","hasBody":true,"bodyHtml":"<p><strong>A useful answer is a moment. A repeated request is a workflow.</strong> Most AI products wait for the user to recognize repetition and build an automation. The product should notice first. When the same request appears again, offer to remember it. When timing repeats, offer to run it. That is how prompting becomes a durable habit without asking every customer to become a workflow designer. The best automation may begin with a simple question. Would you like me to do this every time.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>Repetition is the product signal.</strong> Every repeated prompt is evidence that the user has discovered a workflow. AI products should convert that behavior into a reusable routine before the user has to ask.</p>"}]},{"id":"53c7138c-ac12-47fc-9306-e75b3aac2ad7","title":"Runway is a control question","partner":"Dominique","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/53c7138cac1247fc9306e75b3aac2ad7","hasBody":true,"bodyHtml":"<p><strong>Runway is not just a countdown. It is a path to control.</strong> A low cash balance is dangerous when the company has no credible route to funding itself. The number means something different when the business reaches cash generation before it reaches the floor. Build the plan around that crossing point. What has to be true. Which milestones reduce uncertainty. What cash-cycle risk could move the floor lower than expected. The goal is not to feel comfortable every month. It is to know when the company regains control of its destiny.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>The important runway number is where dependence ends.</strong> Cash planning should show whether the company becomes self-funding before the balance reaches its conservative floor. That is the moment the company controls its choices again.</p>"}]},{"id":"6a4c4eda-6fcc-4978-abb8-1645419ac561","title":"The best AI product hides the product map","partner":"Brett","type":"Team take","status":"Draft","issue":null,"issueId":null,"url":"https://app.notion.com/6a4c4eda6fcc4978abb81645419ac561","hasBody":false,"bodyHtml":"","options":[]},{"id":"f61e1523-d06a-4f3e-a559-0597cae41791","title":"The enterprise deal has a second sale","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/f61e1523d06a4f3ea5590597cae41791","hasBody":true,"bodyHtml":"<p><strong>The enterprise deal has a second sale.</strong> Winning the business buyer does not mean the deal is won. It means the audience changes. The next room may care less about the outcome and more about security, architecture, data, internal build risk, and operational control. Replaying the business demo leaves that audience to translate the product for itself. Treat the technical review as a second sale. Build a separate proof package, name the new objections, and give the champion material that survives the handoff.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>The business case opens the door. The technical case gets you through it.</strong> Enterprise founders need two narratives. One explains why the result matters. The other explains why the product can be trusted inside the customer's environment.</p>"}]},{"id":"d1169dd8-90a7-4adb-b3b7-a850123a3fec","title":"The integration is not the moat","partner":"Tyler","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/d1169dd890a74adbb3b7a850123a3fec","hasBody":true,"bodyHtml":"<p>The integration gets you into the market. What happens after it determines whether you stay.</p><p>Connecting to a model, payment rail, data source, or enterprise system can be difficult and necessary. It is still only admission.</p><p>The durable advantage is the operating layer around that connection. Reliability, judgment, edge cases, and control of the whole workflow are what turn access into a product. As APIs and foundation models become easier to reach, the connector itself becomes easier to replace.</p><p>If the integration disappeared from the pitch, what would still make the outcome better. That is where the moat begins.</p>","options":[]},{"id":"f9a73d1b-c684-47f4-b6ea-a032b5c94471","title":"The pilot is not the finish line","partner":"Jen","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/f9a73d1bc68447f4b6eaa032b5c94471","hasBody":true,"bodyHtml":"<p><strong>A successful pilot removes one risk and reveals the next one.</strong> Before the pilot, the question is whether the product works. After it, the question is whether the company can deploy it repeatedly without turning every customer into a custom project. That means defining the repeatable deployment unit, naming what must remain bespoke, and building the capacity before demand arrives. Strong pull can become a services backlog if every win needs a different implementation. The pilot is not the finish line. It is where the company discovers whether it has built a product or a promising demonstration.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>After the pilot works, replication becomes the product.</strong> Customer pull is only good news when the team can deploy again without rebuilding the company around every account. The next bottleneck often moves from invention to capacity.</p>"}]},{"id":"c375a629-a8a0-45cb-8114-8fa251e78f8a","title":"The sales map follows authority, not enthusiasm","partner":"Dominique","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/c375a629a8a045cb81148fa251e78f8a","hasBody":true,"bodyHtml":"<p>Enterprise software is becoming easier for teams to discover and harder for them to buy. Regional groups can find a product, run a proof, and build enthusiasm before central leadership knows the evaluation exists. Yet standards, budgets, and veto power often remain centralized. This separates demand from authority. Founders must learn to use local pull without mistaking it for purchasing power. The account map becomes a map of who benefits, who pays, who controls the standard, and who can say no. The modern enterprise sale starts at the edge and closes at the center.</p>","options":[]},{"id":"aae8fdea-bf76-4e80-b19a-5fe67aa61d13","title":"The sales map follows budget ownership","partner":"Dominique","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/aae8fdeabf764e80b19a5fe67aa61d13","hasBody":true,"bodyHtml":"<p><strong>User enthusiasm does not tell you who can buy.</strong> Large accounts often split demand and authority. A region may want the product while a central team controls the standard, the budget, or both. Map the account accordingly. Who feels the pain. Who owns the money. Who can approve an exception. Who can stop the deal without joining a call. Regional pull is useful because it creates pressure. It becomes a sale only when the founder understands how that pressure reaches the budget owner.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>The sales map follows authority, not enthusiasm.</strong> In complex enterprises, the user, champion, budget owner, and veto holder may sit in different organizations. Founders need the map before they choose where to apply pressure.</p>"}]},{"id":"e7dd98b0-2b62-4e48-ab39-07dad189606b","title":"Upmarket selling means controlling the process","partner":"Brett","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/e7dd98b02b624e48ab3907dad189606b","hasBody":true,"bodyHtml":"<p>Moving upmarket is not the same sales motion with a larger contract.</p><p>A transactional seller can succeed by responding well to a buyer&#x27;s process. An enterprise seller has to shape that process.</p><p>That means setting the frame, finding every stakeholder, creating urgency, and making the next step explicit. The account cannot be allowed to disappear into its own evaluation machinery.</p><p>If the company wants larger deals, it may need a different operating system for sales, not simply better leads for the current team.</p>","options":[]},{"id":"922ef5ff-0209-4ef3-931c-f5f32ef83035","title":"Vibe coding breaks at multiplayer","partner":"Jen","type":"Team take","status":"Draft","issue":null,"issueId":null,"url":"https://app.notion.com/922ef5ff02094ef3931cf5f32ef83035","hasBody":true,"bodyHtml":"<p><strong>JEN</strong> (draft voice, needs partner pass) The pitch now is \"we can build it ourselves with AI.\" Sometimes you can. Usually you are pricing the first 10 percent of the work and pretending it is the whole job. AI makes prototypes cheap. It does not make ownership cheap. The moment the workflow has to survive a second user, permissions, audit trails, versioning, and \"what happens when the data model changes,\" the bill shows up. Somebody has to be responsible for reliability. Somebody has to be responsible for \"what did the system do and why.\" That is the line between a hacked prototype and a maintained product. If you sell software, do not argue with the vibe coder on speed. Agree. Then narrow the claim. Your product is not faster to start. It is faster to stay started.</p>","options":[]},{"id":"bfa4b875-2cde-423f-b611-5cfa3b6d8777","title":"Your internal tool may be your next platform","partner":"Dominique","type":"Team take","status":"Draft","issue":"Issue 03 \u2014 October 2026","issueId":"3e59dd857da18139b1bdce0bac9b40ee","url":"https://app.notion.com/bfa4b8752cde423fb6115cfa3b6d8777","hasBody":true,"bodyHtml":"<p><strong>When customers ask to use the system behind your service, pay attention.</strong> An internal tool can become a platform when outside users want to bring their own people, data, or workflows onto it. The instinct is to protect the secret sauce. The better question is whether opening the system creates more dependence, distribution, or proprietary context than keeping it private. The test is whether the value compounds. A real platform has reusable boundaries and gets stronger as more participants use it. A custom portal for every partner is still services work. Do not expose the advantage for free. Do not ignore a market telling you it wants to build on top of you.</p>","options":[{"label":"Option 2","bodyHtml":"<p><strong>Your secret sauce may be more valuable as infrastructure.</strong> If customers and suppliers want the internal capture, quality, or orchestration system behind your service, they may be showing you the next product. Open it only when their participation makes the network stronger.</p>"}]}]};
    const ISSUE_DEFAULT = 'Issue 03 — October 2026';

    const PARTNERS = {
      Brett: { full: 'Brett Queener', title: 'Partner', url: 'https://www.bonfirevc.com/team/brett-queener' },
      Tyler: { full: 'Tyler Churchill', title: 'Partner', url: 'https://www.bonfirevc.com/team/tyler-churchill' },
      Jim: { full: 'Jim Andelman', title: 'Partner', url: 'https://www.bonfirevc.com/team/jim-andelman' },
      Mark: { full: 'Mark Mullen', title: 'Partner', url: 'https://www.bonfirevc.com/team/mark-mullen' },
      Jen: { full: 'Jen Richard', title: 'Principal', url: 'https://www.bonfirevc.com/team/jennifer-richard' },
      Jason: { full: 'Jason Tahir', title: 'VP', url: 'https://www.bonfirevc.com/team/jason-tahir' },
      Dominique: { full: 'Dominique', title: '', url: '' },
      Loren: { full: 'Loren', title: '', url: '' },
      Brian: { full: 'Brian', title: '', url: '' },
      Deb: { full: 'Deb Goldstein', title: '', url: '' },
      Anonymous: { full: 'A Bonfire portfolio company', title: '', url: '' },
      TBD: { full: 'TBD', title: '', url: '' }
    };

    const TYPE_TO_SECTION = {
      'Big Idea': 'view',
      'Team take': 'team',
      'Field Notes': 'field'
    };

    let candidates = [];
    let statusFilter = 'all';
    const state = loadState();

    const picker = document.getElementById('picker');
    const preview = document.getElementById('preview');
    const teamCounter = document.getElementById('teamCounter');
    const completeState = document.getElementById('completeState');
    const toast = document.getElementById('toast');
    const syncNote = document.getElementById('syncNote');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return {
          view: typeof saved.view === 'string' ? saved.view : null,
          field: typeof saved.field === 'string' ? saved.field : null,
          team: Array.isArray(saved.team) ? saved.team.slice(0, 4) : []
        };
      } catch (error) {
        return { view: null, field: null, team: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeText(text) {
      return String(text).replace(/[&<>"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char]));
    }

    function partnerMeta(key) {
      return PARTNERS[key] || { full: key || 'Bonfire team', title: '', url: '' };
    }

    function partnerByline(item, forBigIdea) {
      const meta = partnerMeta(item.partner);
      if (item.partner === 'Anonymous') return meta.full;
      if (forBigIdea && meta.title) return meta.full + ', ' + meta.title;
      return meta.full;
    }

    function partnerDisplayName(item) {
      if (!item || item.partner === 'Anonymous' || item.partner === 'TBD') return null;
      return partnerMeta(item.partner).full;
    }

    function bySection(section) {
      return candidates.filter(item => {
        if (item.section !== section) return false;
        if (statusFilter !== 'all' && item.status !== statusFilter) return false;
        return true;
      });
    }

    function find(id) {
      return candidates.find(item => item.id === id);
    }

    function makeOption(item, type, checked, disabled) {
      const id = `pick-${item.id}`;
      const statusClass = item.status === 'Approved' ? 'approved' : '';
      const bodyPill = item.hasBody
        ? '<span class="pill">Has draft</span>'
        : '<span class="pill missing">Body pending</span>';
      return `
        <label class="option ${disabled ? 'is-disabled' : ''} ${checked ? 'is-on' : ''}" data-kind="${type}" for="${id}">
          <input id="${id}" name="${type === 'checkbox' ? item.id : item.section}" type="${type}" value="${item.id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} />
          <span class="check" aria-hidden="true"></span>
          <span>
            <span class="option-title">${escapeText(item.title)}</span>
            <span class="meta">
              <span class="pill">${escapeText(partnerDisplayName(item) || item.partner)}</span>
              <span class="pill ${statusClass}">${escapeText(item.status)}</span>
              ${bodyPill}
            </span>
          </span>
        </label>`;
    }

    function renderPicker() {
      const teamCount = state.team.length;
      const sections = [
        { key: 'view', title: 'The Bonfire View', hint: 'Pick 1', type: 'radio' },
        { key: 'team', title: 'From the Bonfire Team', hint: 'Pick exactly 4', type: 'checkbox' },
        { key: 'field', title: 'Field Notes from the Portfolio', hint: 'Pick 1', type: 'radio' }
      ];

      if (!candidates.length) {
        picker.innerHTML = '<div class="empty-data">No Pieces loaded yet. Sync is still running or pieces.json is empty.</div>';
        teamCounter.textContent = `${teamCount}/4 Team takes`;
        return;
      }

      picker.innerHTML = sections.map(section => {
        const options = bySection(section.key).map(item => {
          const checked = section.key === 'team' ? state.team.includes(item.id) : state[section.key] === item.id;
          const disabled = section.key === 'team' && !checked && teamCount >= 4;
          return makeOption(item, section.type, checked, disabled);
        }).join('') || `<div class="empty-data">No ${section.title} candidates for this filter.</div>`;
        return `
          <div class="section-card">
            <div class="section-title"><h3>${section.title}</h3><span>${section.hint}</span></div>
            ${options}
          </div>`;
      }).join('');

      picker.querySelectorAll('input').forEach(input => input.addEventListener('change', handlePick));
      teamCounter.textContent = `${teamCount}/4 Team takes`;
    }

    function handlePick(event) {
      const input = event.target;
      const item = find(input.value);
      if (!item) return;
      if (item.section === 'team') {
        if (input.checked) {
          if (!state.team.includes(item.id) && state.team.length < 4) state.team.push(item.id);
        } else {
          state.team = state.team.filter(id => id !== item.id);
        }
      } else {
        state[item.section] = item.id;
      }
      saveState();
      renderAll();
    }

    function placeholder(label) {
      return `<div class="placeholder">${label} is open. Pick a candidate to fill this slot.</div>`;
    }

    function bodyOrPending(item, fieldMode) {
      if (item.bodyHtml && item.bodyHtml.trim()) {
        return `<div class="body-copy ${fieldMode ? 'field' : ''}">${item.bodyHtml}</div>`;
      }
      return `<div class="placeholder">Draft body is not on this Piece page yet. Title and byline still preview as they would in the issue.</div>`;
    }

    function contributorNames(view, team, field) {
      const ordered = [];
      const push = (item) => {
        const name = partnerDisplayName(item);
        if (name && !ordered.includes(name)) ordered.push(name);
      };
      if (view) push(view);
      team.forEach(push);
      if (field) push(field);
      return ordered;
    }

    function renderPreview() {
      const view = find(state.view);
      const field = find(state.field);
      const team = state.team.map(find).filter(Boolean);
      const isComplete = Boolean(view && field && team.length === 4);
      completeState.textContent = isComplete ? 'Complete' : 'Incomplete';
      completeState.style.color = isComplete ? 'var(--good)' : 'var(--warn)';

      const teamHtml = team.length
        ? team.map(item => `
            <div class="team-item">
              <p class="team-name">${escapeText((partnerDisplayName(item) || item.partner || '').toUpperCase())}</p>
              <h3>${escapeText(item.title)}</h3>
              ${bodyOrPending(item, false)}
            </div>`).join('')
        : '';
      const emptyTeam = Array.from({ length: Math.max(0, 4 - team.length) }, (_, i) => placeholder(`Team take ${team.length + i + 1}`)).join('');
      const names = contributorNames(view, team, field);

      preview.innerHTML = `
        <header class="masthead">
          <div class="brand">THE BONFIRE <span>SIGNAL</span></div>
          <div class="issue-line">${escapeText(ISSUE_DEFAULT)} · Early-stage B2B from the inside.</div>
          <div class="subhead">Bonfire Ventures leads seed rounds for AI-native B2B companies, which means we spend our days in the rooms where they get built. The Signal is our monthly take on the patterns we're seeing and the questions we think are worth asking next.</div>
          <div class="attr">An internal agent helps us find patterns across partner conversations. The take is the partners'.</div>
        </header>

        <div class="email-pad">
          <section class="email-section">
            <div class="sec-rule"><span class="sec-num">01</span><p class="sec-label">The Bonfire View</p><span class="sec-rail"></span></div>
            <p class="sec-sub">One investor's point of view</p>
            ${view ? `
              <h2>${escapeText(view.title)}</h2>
              <p class="byline">${escapeText(partnerByline(view, true))}</p>
              ${bodyOrPending(view, false)}` : placeholder('The Bonfire View')}
          </section>

          <section class="email-section">
            <div class="sec-rule"><span class="sec-num">02</span><p class="sec-label">From the Bonfire Team</p><span class="sec-rail"></span></div>
            <p class="sec-sub">Four voices, four patterns</p>
            <div class="team-list">${teamHtml}${emptyTeam}</div>
          </section>

          <section class="email-section">
            <div class="sec-rule"><span class="sec-num">03</span><p class="sec-label">Field Notes from the Portfolio</p><span class="sec-rail"></span></div>
            <p class="sec-sub">AI in practice</p>
            ${field ? `
              <h2 class="field">${escapeText(field.title)}</h2>
              ${field.partner !== 'Anonymous' ? `<p class="byline">${escapeText(partnerByline(field, false))}</p>` : ''}
              ${bodyOrPending(field, true)}` : placeholder('Field Note')}
          </section>

          <div class="cta-box">
            <h4>Building an AI-native B2B company?</h4>
            <p>We lead seed rounds and invest $2 to $6 million. If that sounds like you, tell us what you're building.</p>
            <div class="cta-row">
              <a class="cta-btn" href="https://bonfireventures.fillout.com/t/oDd8NpWYHhus" target="_blank" rel="noreferrer">Share your company</a>
              <a class="cta-btn ghost" href="#" onclick="return false;">Share this issue</a>
            </div>
          </div>

          <div class="team-row">
            <p class="label">In this issue</p>
            <p class="names">${names.length ? escapeText(names.join(' · ')) : 'Select pieces to build the contributor row.'}</p>
          </div>

          <p class="tiny">Bonfire Ventures · 11611 San Vicente Boulevard #650 · Los Angeles, CA 90049</p>
        </div>`;
    }

    function renderAll() {
      renderPicker();
      renderPreview();
    }

    function randomPick(list, count) {
      const pool = [...list];
      const out = [];
      while (out.length < count && pool.length) {
        const index = Math.floor(Math.random() * pool.length);
        out.push(pool.splice(index, 1)[0]);
      }
      return out;
    }

    function flash(message) {
      toast.textContent = message;
      window.clearTimeout(flash.timer);
      flash.timer = window.setTimeout(() => { toast.textContent = ''; }, 2600);
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        statusFilter = chip.dataset.filter;
        document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
        renderAll();
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      state.view = null;
      state.field = null;
      state.team = [];
      saveState();
      renderAll();
      flash('Lineup cleared.');
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      const views = bySection('view');
      const fields = bySection('field');
      const teams = bySection('team');
      if (!views.length || !fields.length || teams.length < 4) {
        flash('Need at least 1 View, 4 Team takes, and 1 Field Note.');
        return;
      }
      state.view = randomPick(views, 1)[0].id;
      state.field = randomPick(fields, 1)[0].id;
      state.team = randomPick(teams, 4).map(item => item.id);
      saveState();
      renderAll();
      flash('Complete lineup selected.');
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const view = find(state.view);
      const field = find(state.field);
      const team = state.team.map(find).filter(Boolean);
      const names = contributorNames(view, team, field);
      const lines = [
        'Bonfire Signal lineup',
        '',
        `The Bonfire View: ${view ? view.title + ' | ' + partnerByline(view, true) : '[open]'}`,
        '',
        'From the Bonfire Team',
        ...[0, 1, 2, 3].map(i => `${i + 1}. ${team[i] ? team[i].title + ' | ' + partnerByline(team[i], false) : '[open]'}`),
        '',
        `Field Notes from the Portfolio: ${field ? field.title + (field.partner === 'Anonymous' ? '' : ' | ' + partnerByline(field, false)) : '[open]'}`,
        '',
        `In this issue: ${names.join(' · ') || '[none yet]'}`
      ];
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        flash('Lineup summary copied.');
      } catch (error) {
        flash('Copy failed. Select and copy from the preview instead.');
      }
    });

    function normalizePieces(payload) {
      const list = Array.isArray(payload.pieces) ? payload.pieces : [];
      return list
        .filter(item => TYPE_TO_SECTION[item.type])
        .map(item => ({
          id: item.id,
          title: item.title,
          partner: item.partner || 'TBD',
          status: item.status || 'Draft',
          type: item.type,
          section: TYPE_TO_SECTION[item.type],
          issue: item.issue || null,
          url: item.url,
          hasBody: Boolean(item.hasBody && item.bodyHtml),
          bodyHtml: item.bodyHtml || ''
        }));
    }

    async function boot() {
      try {
        const payload = (typeof INLINE_PIECES !== 'undefined' && INLINE_PIECES && INLINE_PIECES.pieces)
          ? INLINE_PIECES
          : await (await fetch('./pieces.json', { cache: 'no-store' })).json();
        candidates = normalizePieces(payload);
        const withBody = candidates.filter(c => c.hasBody).length;
        const when = payload.syncedAt ? new Date(payload.syncedAt).toLocaleString() : 'pending sync';
        syncNote.textContent = `${candidates.length} Pieces from Notion · ${withBody} with draft body · synced ${when}. Picks stay in this browser only.`;
        if (state.view && !find(state.view)) state.view = null;
        if (state.field && !find(state.field)) state.field = null;
        state.team = state.team.filter(id => Boolean(find(id)));
        saveState();
        renderAll();
      } catch (error) {
        syncNote.textContent = 'Could not load Pieces data.';
        candidates = [];
        renderAll();
      }
    }

    boot();
  </script>
</body>
</html>
